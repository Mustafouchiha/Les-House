# Render static-site blueprint for the Mini App frontend (this repo).
services:
  - type: web
    name: taxta-bozor-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the deployed backend origin, e.g. https://taxta-bozor-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
